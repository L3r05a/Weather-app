<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>

<body>

<div id="container">

<!-- search and temp metric toggle button -->
<div id="topBanner">
    <div id="searchDiv">
        <input type="search" id="searchInput" placeholder="Enter Country">
    </div>
    <div id="metricDiv">
        <button id="metricToggle">C/F</button>
    </div>
</div>

<!-- Main selected country weather forecast -->
<div id="mainPanel">
    <div id="city"></div>
    <div id="icon"></div>
    <div id="time"></div>
    <div id="temp"></div>
    <div id="feelsLIke"></div>
    <div id="conditions"></div>
    <div id="dayForecast"></div>
    <div id="precipit"></div>
    <div id="wind"></div>
    
</div>

<!-- seven days forecast -->
<div id="weeklyForecast">Seven days forecast
    <div id="daysDiv"></div>
</div>

</div>


</body>

</html>
